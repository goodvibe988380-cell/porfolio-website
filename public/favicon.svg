<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="favBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#0055ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- M Gradients -->
    <linearGradient id="favLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <linearGradient id="favDiag" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="favRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0047cc" />
    </linearGradient>

    <!-- Orbit Gradient -->
    <linearGradient id="favOrbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c026d3" />
      <stop offset="25%" stop-color="#9333ea" />
      <stop offset="60%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Tech Capsule Base -->
  <rect width="128" height="128" rx="28" fill="#030712" />
  <rect width="128" height="128" rx="28" fill="url(#favBgGlow)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Embedded Scaled Emblem (Transformed from 40-290 space to 128x128) -->
  <g transform="translate(64, 64) scale(0.56) translate(-165, -132)">
    <!-- Orbit Back -->
    <path d="M 64 172 C 34 148 38 106 84 76 C 132 45 200 44 250 72 C 272 84 282 98 280 112"
          fill="none" stroke="url(#favOrbit)" stroke-width="4.5" stroke-linecap="round" />

    <!-- M Emblem -->
    <g filter="url(#favGlow)">
      <!-- Left Wing -->
      <path d="M 94 66 C 94 57 101 52 110 52 L 124 52 C 128 52 131 54 134 57 L 155 81 C 158 85 158 90 155 94 L 142 106 C 139 108 135 108 132 105 L 118 89 C 115 86 112 88 112 92 L 112 186 C 112 192 106 196 100 196 L 96 196 C 94 196 94 194 94 192 Z"
            fill="url(#favLeft)" />
      <!-- Specular Highlight -->
      <path d="M 94 72 C 94 61 100 54 110 54 L 124 54 C 127 54 130 56 132 58 L 153 82"
            stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />

      <!-- Center Diagonal -->
      <path d="M 120 196 L 142 196 C 147 196 152 193 155 188 L 226 76 C 229 70 227 63 221 59 L 205 53 C 200 51 194 54 191 59 L 117 182 C 114 187 115 193 120 196 Z"
            fill="url(#favDiag)" />
      <path d="M 194 58 L 221 63 C 225 66 226 71 224 75 L 155 188"
            stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" />

      <!-- Right Leg -->
      <path d="M 170 120 L 216 172 C 221 178 224 185 224 192 L 224 193 C 224 197 220 200 215 200 L 198 200 C 193 200 189 196 189 191 L 189 166 C 189 162 187 158 184 155 L 168 136 C 164 130 165 122 170 120 Z"
            fill="url(#favRight)" />
      <path d="M 224 175 L 224 192"
            stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Orbit Front -->
    <path d="M 280 112 C 276 132 242 168 188 196 C 142 218 92 208 64 172"
          fill="none" stroke="url(#favOrbit)" stroke-width="5" stroke-linecap="round" filter="url(#favGlow)" />
    <path d="M 268 124 C 250 152 210 184 164 202 C 118 214 80 198 64 172"
          fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

    <!-- Sparkle on horizon -->
    <g transform="translate(276, 112)">
      <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
      <ellipse cx="0" cy="0" rx="18" ry="2" fill="#a5f3fc" transform="rotate(-28)" />
    </g>
  </g>
</svg>